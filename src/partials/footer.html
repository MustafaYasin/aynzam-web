<footer class="stage border-t border-[var(--border-soft)] pt-20 pb-10 relative">
  <span class="stage-glow" style="bottom: -10%; right: -10%;" aria-hidden="true"></span>

  <div class="container relative">

    <div class="grid grid-cols-1 md:grid-cols-12 gap-12 md:gap-10 mb-16">

      <!-- Brand block -->
      <div class="md:col-span-5">
        <a href="index.html" class="wordmark-lg mb-5" aria-label="AynzamAI">
          <span>AynzamAI</span><span class="dot">.</span>
        </a>
        <p class="body-md max-w-[34ch] mb-6 mt-4" x-text="$store.lang.t('footer.tagline')"></p>
        <a
          href="#"
          class="btn-outline"
          onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;"
        >
          <span x-text="$store.lang.t('footer.cta')"></span>
          <span class="btn-arrow" aria-hidden="true"></span>
        </a>
      </div>

      <!-- Spacer column -->
      <div class="hidden md:block md:col-span-1"></div>

      <!-- Product column -->
      <div class="md:col-span-3">
        <p class="eyebrow mb-5" x-text="$store.lang.t('footer.colProduct')"></p>
        <ul class="flex flex-col gap-3 text-[14.5px] text-[var(--fg-soft)]">
          <li><a href="index.html#use-cases" class="hover:text-[var(--clay)] transition-colors" x-text="$store.lang.t('footer.linkUseCases')"></a></li>
          <li><a href="index.html#workflow" class="hover:text-[var(--clay)] transition-colors" x-text="$store.lang.t('footer.linkWorkflow')"></a></li>
          <li><a href="index.html#industries" class="hover:text-[var(--clay)] transition-colors" x-text="$store.lang.t('footer.linkIndustries')"></a></li>
          <li><a href="pricing.html" class="hover:text-[var(--clay)] transition-colors" x-text="$store.lang.t('footer.linkPricing')"></a></li>
        </ul>
      </div>

      <!-- Company column -->
      <div class="md:col-span-3">
        <p class="eyebrow mb-5" x-text="$store.lang.t('footer.colCompany')"></p>
        <ul class="flex flex-col gap-3 text-[14.5px] text-[var(--fg-soft)]">
          <li><a href="about.html" class="hover:text-[var(--clay)] transition-colors" x-text="$store.lang.t('footer.linkAbout')"></a></li>
          <li><a href="mailto:nisani@pure-msrplanung.de" class="hover:text-[var(--clay)] transition-colors" x-text="$store.lang.t('footer.linkContact')"></a></li>
          <li><a href="#" class="hover:text-[var(--clay)] transition-colors" x-text="$store.lang.t('footer.linkImprint')"></a></li>
        </ul>
      </div>

    </div>

    <!-- Foot bar -->
    <div class="flex flex-col-reverse sm:flex-row items-start sm:items-center justify-between gap-4 pt-8 border-t border-[var(--border-soft)]">
      <p class="mono-sm" x-text="$store.lang.t('footer.copyright')"></p>
      <div class="flex items-center gap-6">
        <a href="#" class="mono-sm hover:text-[var(--fg)] transition-colors" x-text="$store.lang.t('footer.privacy')"></a>
        <a href="#" class="mono-sm hover:text-[var(--fg)] transition-colors" x-text="$store.lang.t('footer.terms')"></a>
        <span class="mono-sm" x-text="$store.lang.t('footer.region')"></span>
      </div>
    </div>

  </div>
</footer>
