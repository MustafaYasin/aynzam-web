<header
  class="fixed left-0 top-0 w-full z-50 transition-all duration-300"
  :class="stickyMenu ? 'py-3 bg-[var(--bg-deep)]/80 backdrop-blur-xl border-b border-[var(--border-soft)] shadow-[0_4px_24px_-12px_rgba(38,30,22,0.25)]' : 'py-5'"
  x-data="{ stickyMenu: false, mobileMenuOpen: false }"
  @scroll.window="stickyMenu = window.scrollY > 16"
>
  <div class="container flex items-center justify-between gap-6">

    <!-- Wordmark -->
    <a href="index.html" class="wordmark group" aria-label="AynzamAI">
      <span>AynzamAI</span><span class="dot">.</span>
    </a>

    <!-- Desktop Nav -->
    <nav class="hidden lg:flex items-center gap-1" aria-label="Hauptnavigation">
      <a href="index.html#use-cases" class="nav-link" x-text="$store.lang.t('header.useCases')"></a>
      <a href="index.html#workflow" class="nav-link" x-text="$store.lang.t('header.workflow')"></a>
      <a href="index.html#industries" class="nav-link" x-text="$store.lang.t('header.industries')"></a>
      <a href="pricing.html" class="nav-link" x-text="$store.lang.t('header.pricing')"></a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <!-- Language Toggle -->
      <button
        type="button"
        @click="$store.lang.toggle()"
        class="min-w-[40px] h-10 inline-flex items-center justify-center mono-sm uppercase tracking-[0.12em] hover:text-[var(--fg)] transition-colors"
        :aria-label="$store.lang.current === 'de' ? 'Switch to English' : 'Auf Deutsch umschalten'"
        x-text="$store.lang.current === 'de' ? 'EN' : 'DE'"
      ></button>

      <!-- Theme Toggle -->
      <button
        type="button"
        @click="$store.theme.toggle()"
        class="w-10 h-10 inline-flex items-center justify-center text-[var(--fg-muted)] hover:text-[var(--fg)] transition-colors"
        aria-label="Toggle theme"
      >
        <template x-if="$store.theme.isDark">
          <svg class="w-[16px] h-[16px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </template>
        <template x-if="!$store.theme.isDark">
          <svg class="w-[16px] h-[16px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </template>
      </button>

      <!-- CTA -->
      <a
        href="#"
        class="hidden md:inline-flex btn-outline"
        onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;"
      >
        <span x-text="$store.lang.t('header.bookDemo')"></span>
        <span class="btn-arrow" aria-hidden="true"></span>
      </a>

      <!-- Mobile Toggle -->
      <button
        type="button"
        class="lg:hidden w-11 h-11 inline-flex items-center justify-center text-[var(--fg)] transition-colors"
        @click="mobileMenuOpen = !mobileMenuOpen"
        :aria-expanded="mobileMenuOpen"
        aria-label="Menu"
      >
        <svg x-show="!mobileMenuOpen" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <svg x-show="mobileMenuOpen" x-cloak class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div
    x-show="mobileMenuOpen"
    x-cloak
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-y-2"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-2"
    class="lg:hidden absolute top-full left-0 w-full border-b border-[var(--border-soft)] bg-[var(--bg-deep)]"
  >
    <div class="container py-5 flex flex-col gap-1">
      <a href="index.html#use-cases" class="nav-link justify-between py-3" @click="mobileMenuOpen = false">
        <span x-text="$store.lang.t('header.useCases')"></span>
      </a>
      <a href="index.html#workflow" class="nav-link justify-between py-3" @click="mobileMenuOpen = false">
        <span x-text="$store.lang.t('header.workflow')"></span>
      </a>
      <a href="index.html#industries" class="nav-link justify-between py-3" @click="mobileMenuOpen = false">
        <span x-text="$store.lang.t('header.industries')"></span>
      </a>
      <a href="pricing.html" class="nav-link justify-between py-3" @click="mobileMenuOpen = false">
        <span x-text="$store.lang.t('header.pricing')"></span>
      </a>
      <div class="pt-4 mt-2 border-t border-[var(--border-soft)]">
        <a
          href="#"
          class="btn-primary w-full"
          @click="mobileMenuOpen = false"
          onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;"
        >
          <span x-text="$store.lang.t('header.bookDemo')"></span>
          <span class="btn-arrow" aria-hidden="true"></span>
        </a>
      </div>
    </div>
  </div>
</header>
