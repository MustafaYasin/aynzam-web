<header
  class="site-header"
  :class="{ 'is-stuck': stuck, 'on-hero': onHero }"
  x-data="{
    stuck: false,
    onHero: document.body.dataset.hero === 'silver',
    mobileMenuOpen: false,
    check() { this.stuck = window.scrollY > 24 }
  }"
  x-init="check()"
  @scroll.window.passive="check()"
>
  <!-- Announcement bar -->
  <div class="announce" x-show="!stuck" x-transition.opacity.duration.200ms>
    <span x-text="$store.lang.t('announce.text')"></span>
    <a href="#" class="text-link" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
      <span x-text="$store.lang.t('announce.link')"></span>
      <span class="btn-arrow" aria-hidden="true"></span>
    </a>
  </div>

  <div class="container">
    <div class="header-bar">

      <!-- Wordmark -->
      <a href="index.html" class="wordmark" aria-label="aynzamAI">
        <span>aynzam</span><span class="tail">AI</span>
      </a>

      <!-- Desktop nav -->
      <nav class="hidden lg:flex items-center gap-1 absolute left-1/2 -translate-x-1/2" aria-label="Hauptnavigation">
        <a href="index.html#platform" class="nav-link" x-text="$store.lang.t('header.platform')"></a>
        <a href="index.html#industries" class="nav-link" x-text="$store.lang.t('header.industries')"></a>
        <a href="about.html" class="nav-link" x-text="$store.lang.t('header.company')"></a>
        <a href="blog-grid.html" class="nav-link" x-text="$store.lang.t('header.blog')"></a>
      </nav>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        <button
          type="button"
          @click="$store.lang.toggle()"
          class="hdr-pill"
          :aria-label="$store.lang.current === 'de' ? 'Switch to English' : 'Auf Deutsch umschalten'"
          x-text="$store.lang.current === 'de' ? 'DE' : 'EN'"
        ></button>

        <a
          href="#"
          class="hidden sm:inline-flex hdr-cta"
          onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;"
        >
          <span x-text="$store.lang.t('header.cta')"></span>
        </a>

        <button
          type="button"
          class="lg:hidden hdr-pill w-8 !px-0"
          @click="mobileMenuOpen = !mobileMenuOpen"
          :aria-expanded="mobileMenuOpen"
          aria-label="Menu"
        >
          <svg x-show="!mobileMenuOpen" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path stroke-linecap="round" d="M4 8h16M4 16h16" />
          </svg>
          <svg x-show="mobileMenuOpen" x-cloak class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path stroke-linecap="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  <div
    x-show="mobileMenuOpen"
    x-cloak
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-y-2"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-2"
    class="lg:hidden absolute top-full left-0 w-full menu-panel"
  >
    <div class="container py-4 flex flex-col">
      <a href="index.html#platform" class="nav-link" @click="mobileMenuOpen = false" x-text="$store.lang.t('header.platform')"></a>
      <a href="index.html#industries" class="nav-link" @click="mobileMenuOpen = false" x-text="$store.lang.t('header.industries')"></a>
      <a href="about.html" class="nav-link" @click="mobileMenuOpen = false" x-text="$store.lang.t('header.company')"></a>
      <a href="blog-grid.html" class="nav-link" @click="mobileMenuOpen = false" x-text="$store.lang.t('header.blog')"></a>
      <div class="pt-4 mt-2 border-t border-[var(--line)]">
        <a
          href="#"
          class="btn btn-primary w-full"
          @click="mobileMenuOpen = false"
          onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;"
        >
          <span x-text="$store.lang.t('header.cta')"></span>
        </a>
      </div>
    </div>
  </div>
</header>
