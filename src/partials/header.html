<header 
  class="fixed left-0 top-0 w-full z-50 transition-all duration-300 border-b border-transparent"
  :class="{ 'bg-[var(--glass-bg)] backdrop-blur-md border-[var(--border-primary)] shadow-sm': stickyMenu, 'py-5': !stickyMenu, 'py-3': stickyMenu }"
  x-data="{ 
    stickyMenu: false, 
    mobileMenuOpen: false
  }"
  @scroll.window="stickyMenu = (window.scrollY > 20) ? true : false"
>
  <div class="container flex items-center justify-between">
    <!-- Logo -->
    <a href="index.html" class="text-2xl font-bold tracking-tighter text-[var(--text-primary)] flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-[var(--brand-color)] flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
      </div>
      <span>AynzamAI</span>
    </a>

    <!-- Desktop Nav -->
    <nav class="hidden lg:block">
      <ul class="flex items-center gap-8">
        <li><a href="#home" class="nav-link">Home</a></li>
        <li><a href="#features" class="nav-link">Features</a></li>
        <li><a href="#pricing" class="nav-link">Pricing</a></li>
        <li><a href="#testimonials" class="nav-link">Stories</a></li>
      </ul>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-2 md:gap-4">
      
      <!-- Theme Toggle -->
      <button 
        @click="$store.theme.toggle()" 
        class="w-10 h-10 rounded-full flex items-center justify-center text-[var(--text-secondary)] hover:bg-[var(--bg-secondary)] hover:text-[var(--text-primary)] transition-all focus:outline-none"
        aria-label="Toggle Dark Mode"
      >
        <!-- Sun Icon (Show when Dark) -->
        <template x-if="$store.theme.isDark">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </template>
        <!-- Moon Icon (Show when Light) -->
        <template x-if="!$store.theme.isDark">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </template>
      </button>

      <a href="#" class="hidden md:inline-flex btn-primary text-sm px-6 py-2.5">Get Started</a>
      
      <!-- Mobile Toggle -->
      <button class="lg:hidden w-10 h-10 flex items-center justify-center text-[var(--text-primary)] focus:outline-none" @click="mobileMenuOpen = !mobileMenuOpen">
        <svg x-show="!mobileMenuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
        <svg x-show="mobileMenuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display: none;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div 
    x-show="mobileMenuOpen" 
    x-cloak
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-y-4"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-4"
    class="lg:hidden absolute top-full left-0 w-full bg-[var(--bg-primary)] border-t border-[var(--border-primary)] p-6 flex flex-col gap-4 shadow-2xl"
  >
    <a href="#home" class="text-lg font-medium text-[var(--text-primary)] py-2" @click="mobileMenuOpen = false">Home</a>
    <a href="#features" class="text-lg font-medium text-[var(--text-primary)] py-2" @click="mobileMenuOpen = false">Features</a>
    <a href="#pricing" class="text-lg font-medium text-[var(--text-primary)] py-2" @click="mobileMenuOpen = false">Pricing</a>
    <a href="#testimonials" class="text-lg font-medium text-[var(--text-primary)] py-2" @click="mobileMenuOpen = false">Stories</a>
    <hr class="border-[var(--border-secondary)]">
    <a href="#" class="btn-primary text-center mt-2" @click="mobileMenuOpen = false">Get Started</a>
  </div>
</header>
