<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anmelden · aynzamAI</title>
    <include src="./partials/fonts.html" />
    <include src="./partials/lang-init.html" />
  </head>

  <body x-data>
    <include src="./partials/header.html" />

    <main>
      <section class="min-h-[100svh] grid grid-cols-1 lg:grid-cols-2">
        <div class="hidden lg:block art-steel"></div>
        <div class="flex items-center justify-center px-6 pt-36 pb-16">
          <form class="w-full max-w-[380px]" @submit.prevent>
            <h1 class="display-md mb-2" x-text="$store.lang.t('signin.title')"></h1>
            <p class="body-sm mb-8" x-text="$store.lang.t('signin.sub')"></p>

            <label class="block mb-4">
              <span class="body-xs block mb-1.5" x-text="$store.lang.t('signin.emailLabel')"></span>
              <input type="email" class="input" :placeholder="$store.lang.t('signin.emailPlaceholder')" autocomplete="email" />
            </label>
            <label class="block mb-3">
              <span class="body-xs block mb-1.5" x-text="$store.lang.t('signin.passwordLabel')"></span>
              <input type="password" class="input" :placeholder="$store.lang.t('signin.passwordPlaceholder')" autocomplete="current-password" />
            </label>
            <div class="flex justify-end mb-6">
              <a href="#" class="body-xs hover:text-[var(--ink)]" x-text="$store.lang.t('signin.forgotPassword')"></a>
            </div>

            <button type="submit" class="btn btn-primary w-full" x-text="$store.lang.t('signin.submitButton')"></button>

            <p class="body-sm text-center mt-6">
              <span x-text="$store.lang.t('signin.noAccount')"></span>
              <a href="signup.html" class="text-[var(--ink)] font-medium ml-1" x-text="$store.lang.t('signin.signUpLink')"></a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <include src="./partials/footer.html" />
  </body>
</html>
