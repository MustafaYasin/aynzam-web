<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aynzamAI</title>
    <include src="./partials/fonts.html" />
    <include src="./partials/lang-init.html" />
  </head>

  <body x-data>
    <include src="./partials/header.html" />

    <main>
      <article class="pt-40 pb-24 sm:pt-48 sm:pb-32">
        <div class="container-narrow">
          <a href="blog-grid.html" class="text-link mb-10">
            <span class="btn-arrow rotate-180" aria-hidden="true"></span>
            <span x-text="$store.lang.t('blog.back')"></span>
          </a>

          <div class="flex items-center gap-3 body-xs mt-8 mb-5">
            <span class="chip" x-text="$store.lang.t('blog.single.tag')"></span>
            <span x-text="$store.lang.t('blog.single.date')"></span>
          </div>

          <h1 class="display-lg max-w-[22ch] mb-10" x-text="$store.lang.t('blog.single.title')"></h1>

          <div class="art-carbon rounded-[14px] h-[260px] sm:h-[420px] mb-12"></div>

          <div class="max-w-[64ch] flex flex-col gap-6">
            <p class="lead" x-text="$store.lang.t('blog.single.p1')"></p>
            <h2 class="display-sm mt-4" x-text="$store.lang.t('blog.single.h2')"></h2>
            <p class="body-md" x-text="$store.lang.t('blog.single.p2')"></p>
            <p class="body-md" x-text="$store.lang.t('blog.single.p3')"></p>
          </div>
        </div>
      </article>
    </main>

    <include src="./partials/footer.html" />
  </body>
</html>
