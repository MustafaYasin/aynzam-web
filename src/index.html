<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AynzamAI — Engineering-Doku für TGA</title>
    <meta name="description" content="AynzamAI generiert Funktionsbeschreibungen, Leistungsverzeichnisse und Fließmatrizen für TGA — geprüft gegen VDI, DIN und GMP Annex 1." />
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <include src="./partials/lang-init.html" />
  </head>

  <body x-data="{ loaded: true }" x-init="loaded = true">
    <include src="./partials/header.html" />

    <main>

      <!-- ===== Hero ===== -->
      <section id="home" class="stage relative pt-36 pb-24 sm:pt-44 sm:pb-32">
        <span class="stage-glow" style="top: 18%; left: -10%;" aria-hidden="true"></span>

        <div class="container relative">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-start">

            <!-- Left: editorial block -->
            <div class="lg:col-span-7 max-w-[640px]">
              <p class="eyebrow mb-6 animate-fade-up delay-0" x-text="$store.lang.t('hero.eyebrow')"></p>

              <h1 class="headline-xl mb-7 animate-fade-up delay-1">
                <span x-text="$store.lang.t('hero.titleA')"></span>
                <em x-text="$store.lang.t('hero.titleEm')"></em><span x-text="$store.lang.t('hero.titleB')"></span>
              </h1>

              <p class="deck mb-10 max-w-[58ch] animate-fade-up delay-2" x-text="$store.lang.t('hero.deck')"></p>

              <div class="flex flex-wrap items-center gap-4 mb-12 animate-fade-up delay-3">
                <a
                  href="#"
                  class="btn-primary"
                  onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;"
                >
                  <span x-text="$store.lang.t('hero.ctaPrimary')"></span>
                  <span class="btn-arrow" aria-hidden="true"></span>
                </a>
                <a href="#use-cases" class="btn-ghost">
                  <span x-text="$store.lang.t('hero.ctaSecondary')"></span>
                  <span class="btn-arrow" aria-hidden="true"></span>
                </a>
              </div>
            </div>

            <!-- Right: value-list editorial card -->
            <aside class="lg:col-span-5 animate-fade-up delay-3">
              <div class="card relative">
                <p class="eyebrow mb-5" x-text="$store.lang.t('hero.cardEyebrow')"></p>
                <ul class="value-list">
                  <li>
                    <span class="mark">01</span>
                    <span>
                      <strong class="text-[var(--fg)] font-medium" x-text="$store.lang.t('hero.value1Strong')"></strong>
                      <span x-text="$store.lang.t('hero.value1Rest')"></span>
                    </span>
                  </li>
                  <li>
                    <span class="mark">02</span>
                    <span>
                      <strong class="text-[var(--fg)] font-medium" x-text="$store.lang.t('hero.value2Strong')"></strong>
                      <span x-text="$store.lang.t('hero.value2Rest')"></span>
                    </span>
                  </li>
                  <li>
                    <span class="mark">03</span>
                    <span>
                      <strong class="text-[var(--fg)] font-medium" x-text="$store.lang.t('hero.value3Strong')"></strong>
                      <span x-text="$store.lang.t('hero.value3Rest')"></span>
                    </span>
                  </li>
                  <li>
                    <span class="mark-clay">→</span>
                    <span class="text-[var(--fg)]" x-text="$store.lang.t('hero.value4')"></span>
                  </li>
                </ul>
              </div>
            </aside>

          </div>
        </div>
      </section>

      <!-- ===== Trust strip ===== -->
      <section class="border-y border-[var(--border-soft)] py-10">
        <div class="container">
          <div class="flex flex-col sm:flex-row items-center gap-6 sm:gap-10 justify-between">
            <p class="eyebrow" x-text="$store.lang.t('trust.label')"></p>
            <div class="flex flex-wrap items-center justify-center gap-x-10 gap-y-3">
              <span class="mono-sm" x-text="$store.lang.t('trust.c1')"></span>
              <span class="mono-sm" x-text="$store.lang.t('trust.c2')"></span>
              <span class="mono-sm" x-text="$store.lang.t('trust.c3')"></span>
              <span class="mono-sm" x-text="$store.lang.t('trust.c4')"></span>
              <span class="mono-sm" x-text="$store.lang.t('trust.c5')"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Use Cases ===== -->
      <section id="use-cases" class="py-24 sm:py-32">
        <div class="container">

          <div class="max-w-3xl mb-16">
            <p class="eyebrow mb-5" x-text="$store.lang.t('useCases.eyebrow')"></p>
            <h2 class="headline-lg mb-5">
              <span x-text="$store.lang.t('useCases.titleA')"></span>
              <em x-text="$store.lang.t('useCases.titleEm')"></em><span x-text="$store.lang.t('useCases.titleB')"></span>
            </h2>
            <p class="deck max-w-[60ch]" x-text="$store.lang.t('useCases.deck')"></p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <article class="card-clay flex flex-col">
              <div class="flex items-center gap-3 mb-6">
                <span class="mark-clay">01</span>
                <p class="eyebrow" x-text="$store.lang.t('useCases.c1.tag')"></p>
              </div>
              <h3 class="headline-md mb-4" x-text="$store.lang.t('useCases.c1.title')"></h3>
              <p class="body-md mb-6 flex-1" x-text="$store.lang.t('useCases.c1.body')"></p>
              <div class="flex flex-wrap gap-1.5 mt-auto">
                <span class="norm-chip">PAL</span>
                <span class="norm-chip">MAL</span>
                <span class="norm-chip">DHU</span>
                <span class="norm-chip">FCU</span>
                <span class="norm-chip">FFU</span>
                <span class="norm-chip">RCU</span>
                <span class="norm-chip">RLT</span>
              </div>
            </article>

            <article class="card-clay flex flex-col">
              <div class="flex items-center gap-3 mb-6">
                <span class="mark-clay">02</span>
                <p class="eyebrow" x-text="$store.lang.t('useCases.c2.tag')"></p>
              </div>
              <h3 class="headline-md mb-4" x-text="$store.lang.t('useCases.c2.title')"></h3>
              <p class="body-md mb-6 flex-1" x-text="$store.lang.t('useCases.c2.body')"></p>
              <div class="flex flex-wrap gap-1.5 mt-auto">
                <span class="norm-chip">VOB/A</span>
                <span class="norm-chip">VOB/B</span>
                <span class="norm-chip">DIN 276</span>
                <span class="norm-chip">GAEB X86</span>
              </div>
            </article>

            <article class="card-clay flex flex-col">
              <div class="flex items-center gap-3 mb-6">
                <span class="mark-clay">03</span>
                <p class="eyebrow" x-text="$store.lang.t('useCases.c3.tag')"></p>
              </div>
              <h3 class="headline-md mb-4" x-text="$store.lang.t('useCases.c3.title')"></h3>
              <p class="body-md mb-6 flex-1" x-text="$store.lang.t('useCases.c3.body')"></p>
              <div class="flex flex-wrap gap-1.5 mt-auto">
                <span class="norm-chip">draw.io</span>
                <span class="norm-chip">DWG</span>
                <span class="norm-chip">SVG</span>
                <span class="norm-chip">PDF</span>
              </div>
            </article>

          </div>
        </div>
      </section>

      <!-- ===== Workflow ===== -->
      <section id="workflow" class="stage py-24 sm:py-32 border-y border-[var(--border-soft)]">
        <span class="stage-glow" style="bottom: -20%; left: 30%;" aria-hidden="true"></span>

        <div class="container relative">

          <div class="max-w-3xl mb-16">
            <p class="eyebrow mb-5" x-text="$store.lang.t('workflow.eyebrow')"></p>
            <h2 class="headline-lg mb-5">
              <span x-text="$store.lang.t('workflow.titleA')"></span>
              <em x-text="$store.lang.t('workflow.titleEm')"></em><span x-text="$store.lang.t('workflow.titleB')"></span>
            </h2>
            <p class="deck max-w-[60ch]" x-text="$store.lang.t('workflow.deck')"></p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-10">

            <div>
              <hr class="hr-tick mb-6" />
              <p class="mono-sm mb-3">
                <span class="text-[var(--clay)] font-semibold">01</span>
                <span class="mx-2">—</span>
                <span x-text="$store.lang.t('workflow.s1.label')"></span>
              </p>
              <h3 class="headline-sm mb-3" x-text="$store.lang.t('workflow.s1.title')"></h3>
              <p class="body-md" x-text="$store.lang.t('workflow.s1.body')"></p>
            </div>

            <div>
              <hr class="hr-tick mb-6" />
              <p class="mono-sm mb-3">
                <span class="text-[var(--clay)] font-semibold">02</span>
                <span class="mx-2">—</span>
                <span x-text="$store.lang.t('workflow.s2.label')"></span>
              </p>
              <h3 class="headline-sm mb-3" x-text="$store.lang.t('workflow.s2.title')"></h3>
              <p class="body-md mb-4" x-text="$store.lang.t('workflow.s2.body')"></p>
              <div class="flex flex-wrap gap-1.5">
                <span class="norm-chip">VDI 6022</span>
                <span class="norm-chip">DIN 1946-4</span>
                <span class="norm-chip">GMP Annex 1</span>
                <span class="norm-chip">EN 50600</span>
              </div>
            </div>

            <div>
              <hr class="hr-tick mb-6" />
              <p class="mono-sm mb-3">
                <span class="text-[var(--clay)] font-semibold">03</span>
                <span class="mx-2">—</span>
                <span x-text="$store.lang.t('workflow.s3.label')"></span>
              </p>
              <h3 class="headline-sm mb-3" x-text="$store.lang.t('workflow.s3.title')"></h3>
              <p class="body-md mb-4" x-text="$store.lang.t('workflow.s3.body')"></p>
              <div class="flex flex-wrap gap-1.5">
                <span class="norm-chip">Word</span>
                <span class="norm-chip">PDF</span>
                <span class="norm-chip">draw.io</span>
                <span class="norm-chip">GAEB X86</span>
              </div>
            </div>

          </div>
        </div>
      </section>

      <!-- ===== Industries ===== -->
      <section id="industries" class="py-24 sm:py-32">
        <div class="container">

          <div class="max-w-3xl mb-16">
            <p class="eyebrow mb-5" x-text="$store.lang.t('industries.eyebrow')"></p>
            <h2 class="headline-lg mb-5">
              <span x-text="$store.lang.t('industries.titleA')"></span>
              <em x-text="$store.lang.t('industries.titleEm')"></em><span x-text="$store.lang.t('industries.titleB')"></span>
            </h2>
            <p class="deck max-w-[60ch]" x-text="$store.lang.t('industries.deck')"></p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <article class="card flex flex-col">
              <p class="eyebrow mb-4" x-text="$store.lang.t('industries.i1.tag')"></p>
              <h3 class="headline-md mb-3" x-text="$store.lang.t('industries.i1.title')"></h3>
              <p class="body-md mb-6 flex-1" x-text="$store.lang.t('industries.i1.body')"></p>
              <div class="flex flex-wrap gap-1.5 mt-auto">
                <span class="norm-chip">ISO 14644</span>
                <span class="norm-chip">VDI 2083</span>
                <span class="norm-chip">SEMI F</span>
              </div>
            </article>

            <article class="card flex flex-col">
              <p class="eyebrow mb-4" x-text="$store.lang.t('industries.i2.tag')"></p>
              <h3 class="headline-md mb-3" x-text="$store.lang.t('industries.i2.title')"></h3>
              <p class="body-md mb-6 flex-1" x-text="$store.lang.t('industries.i2.body')"></p>
              <div class="flex flex-wrap gap-1.5 mt-auto">
                <span class="norm-chip">GMP Annex 1</span>
                <span class="norm-chip">VDI 6022</span>
                <span class="norm-chip">Dryroom</span>
              </div>
            </article>

            <article class="card flex flex-col">
              <p class="eyebrow mb-4" x-text="$store.lang.t('industries.i3.tag')"></p>
              <h3 class="headline-md mb-3" x-text="$store.lang.t('industries.i3.title')"></h3>
              <p class="body-md mb-6 flex-1" x-text="$store.lang.t('industries.i3.body')"></p>
              <div class="flex flex-wrap gap-1.5 mt-auto">
                <span class="norm-chip">EN 50600</span>
                <span class="norm-chip">Tier III/IV</span>
                <span class="norm-chip">VDI 2050</span>
              </div>
            </article>

          </div>
        </div>
      </section>

      <!-- ===== Final CTA ===== -->
      <section class="stage py-24 sm:py-32 border-t border-[var(--border-soft)]">
        <span class="stage-glow" style="top: 10%; right: -10%;" aria-hidden="true"></span>

        <div class="container relative">
          <div class="max-w-2xl mx-auto text-center">
            <p class="eyebrow mb-6 inline-block" x-text="$store.lang.t('finalCta.eyebrow')"></p>
            <h2 class="headline-lg mb-5">
              <span x-text="$store.lang.t('finalCta.titleA')"></span>
              <em x-text="$store.lang.t('finalCta.titleEm')"></em><span x-text="$store.lang.t('finalCta.titleB')"></span>
            </h2>
            <p class="deck mb-10" x-text="$store.lang.t('finalCta.deck')"></p>
            <a
              href="#"
              class="btn-primary"
              onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;"
            >
              <span x-text="$store.lang.t('finalCta.button')"></span>
              <span class="btn-arrow" aria-hidden="true"></span>
            </a>
          </div>
        </div>
      </section>

    </main>

    <include src="./partials/footer.html" />
  </body>
</html>
