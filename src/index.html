<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aynzamAI</title>
    <meta name="description" content="aynzamAI hilft Planungsbüros, Bauunternehmen und Betreibern, technische Dokumentation schneller zu erstellen, zu prüfen und zu übergeben. Normkonform nach DIN, VDI und VOB." />
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <include src="./partials/fonts.html" />
    <include src="./partials/lang-init.html" />
  </head>

  <body data-hero="silver" x-data>
    <include src="./partials/header.html" />

    <main>

      <!-- ===== Hero ===== -->
      <section id="home" class="hero-silver">
        <div class="container w-full pb-14 pt-40 sm:pb-16">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-8 items-end">
            <div class="lg:col-span-8">
              <h1 class="hero-title animate-fade-up delay-1">
                <span x-text="$store.lang.t('hero.line1')"></span><br />
                <span x-text="$store.lang.t('hero.line2')"></span>
              </h1>
            </div>
            <div class="lg:col-span-4 lg:pb-2">
              <p class="hero-deck mb-5 animate-fade-up delay-2" x-text="$store.lang.t('hero.deck')"></p>
              <div class="flex flex-wrap items-center gap-2 animate-fade-up delay-3">
                <a
                  href="#"
                  class="btn btn-white"
                  onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;"
                >
                  <span x-text="$store.lang.t('hero.ctaPrimary')"></span>
                </a>
                <a href="#platform" class="btn btn-outline-white">
                  <span x-text="$store.lang.t('hero.ctaSecondary')"></span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Logo wall ===== -->
      <section id="logos" class="py-16 sm:py-20">
        <div class="container">
          <p class="text-[15px] text-center text-[var(--ink)] mb-8" x-text="$store.lang.t('logos.title')"></p>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-[3px]">
            <div class="logo-cell">
              <img src="./images/logos/powerco.png" :alt="$store.lang.t('logos.c1')" loading="lazy" decoding="async" />
            </div>
            <div class="logo-cell">
              <img src="./images/logos/vw.png" :alt="$store.lang.t('logos.c2')" loading="lazy" decoding="async" style="max-height: 44px;" />
            </div>
            <div class="logo-cell">
              <img src="./images/logos/exyte.png" :alt="$store.lang.t('logos.c3')" loading="lazy" decoding="async" />
            </div>
            <div class="logo-cell">
              <img src="./images/logos/ariston.svg" :alt="$store.lang.t('logos.c4')" loading="lazy" decoding="async" style="max-height: 30px;" />
            </div>
            <div class="logo-cell"><span class="logo-cell-label" x-text="$store.lang.t('logos.l1')"></span></div>
            <div class="logo-cell"><span class="logo-cell-label" x-text="$store.lang.t('logos.l2')"></span></div>
            <div class="logo-cell"><span class="logo-cell-label" x-text="$store.lang.t('logos.l3')"></span></div>
            <div class="logo-cell"><span class="logo-cell-label" x-text="$store.lang.t('logos.l4')"></span></div>
          </div>
        </div>
      </section>

      <!-- ===== Stories (outputs) rail ===== -->
      <section id="stories" class="py-14 sm:py-20">
        <div class="container-narrow" x-data="rail()">
          <div class="flex items-end justify-between gap-6 mb-8">
            <h2 class="display-md max-w-[30ch]">
              <span x-text="$store.lang.t('stories.title1') + ' '"></span><br class="hidden sm:block" />
              <span x-text="$store.lang.t('stories.title2')"></span>
            </h2>
            <div class="hidden sm:flex items-center gap-2 pb-1">
              <button type="button" class="icon-btn" @click="prev()" :disabled="atStart" aria-label="Zurück">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7" /></svg>
              </button>
              <button type="button" class="icon-btn" @click="next()" :disabled="atEnd" aria-label="Weiter">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
              </button>
            </div>
          </div>

          <div class="rail" x-ref="rail" @scroll.passive="update()">
            <a href="#platform" class="story-card art-carbon">
              <span class="story-arrow" aria-hidden="true">↗</span>
              <span class="story-title" x-text="$store.lang.t('stories.s1.title')"></span>
              <span class="story-meta">
                <span x-text="$store.lang.t('stories.s1.meta')"></span>
                <span class="story-tag">LV · GAEB</span>
              </span>
            </a>
            <a href="#platform" class="story-card art-silver">
              <span class="story-arrow" aria-hidden="true">↗</span>
              <span class="story-title" x-text="$store.lang.t('stories.s2.title')"></span>
              <span class="story-meta">
                <span x-text="$store.lang.t('stories.s2.meta')"></span>
                <span class="story-tag">TGA</span>
              </span>
            </a>
            <a href="#platform" class="story-card art-graphite">
              <span class="story-arrow" aria-hidden="true">↗</span>
              <span class="story-title" x-text="$store.lang.t('stories.s3.title')"></span>
              <span class="story-meta">
                <span x-text="$store.lang.t('stories.s3.meta')"></span>
                <span class="story-tag">Normprüfung</span>
              </span>
            </a>
            <a href="#platform" class="story-card art-ember">
              <span class="story-arrow" aria-hidden="true">↗</span>
              <span class="story-title" x-text="$store.lang.t('stories.s4.title')"></span>
              <span class="story-meta">
                <span x-text="$store.lang.t('stories.s4.meta')"></span>
                <span class="story-tag">Übergabe</span>
              </span>
            </a>
            <a href="#platform" class="story-card art-steel">
              <span class="story-arrow" aria-hidden="true">↗</span>
              <span class="story-title" x-text="$store.lang.t('stories.s5.title')"></span>
              <span class="story-meta">
                <span x-text="$store.lang.t('stories.s5.meta')"></span>
                <span class="story-tag">Schema</span>
              </span>
            </a>
            <a href="#platform" class="story-card art-mist">
              <span class="story-arrow" aria-hidden="true">↗</span>
              <span class="story-title" x-text="$store.lang.t('stories.s6.title')"></span>
              <span class="story-meta">
                <span x-text="$store.lang.t('stories.s6.meta')"></span>
                <span class="story-tag">Betrieb</span>
              </span>
            </a>
          </div>
        </div>
      </section>

      <!-- ===== Statement ===== -->
      <section id="statement" class="py-24 sm:py-36">
        <div class="container">
          <p class="statement text-center max-w-[22ch] mx-auto" data-statement x-text="$store.lang.t('statement.text')"></p>
        </div>
      </section>

      <!-- ===== Platform (dark stage) ===== -->
      <section id="platform" class="stage-dark on-dark">
        <div class="dot-field" aria-hidden="true"></div>

        <div class="container relative">
          <div class="relative min-h-[88svh] flex flex-col items-center justify-center text-center py-28">
            <!-- Floating labels -->
            <div class="absolute inset-0 hidden md:block" aria-hidden="true">
              <span class="float-label" style="left: 0%; top: 14%; animation-delay: 0s;" x-text="$store.lang.t('platform.labels.l1')"></span>
              <span class="float-label" style="left: 15%; top: 34%; animation-delay: -3s;" x-text="$store.lang.t('platform.labels.l2')"></span>
              <span class="float-label" style="left: 3%; top: 56%; animation-delay: -6s;" x-text="$store.lang.t('platform.labels.l3')"></span>
              <span class="float-label" style="left: 20%; top: 78%; animation-delay: -1.5s;" x-text="$store.lang.t('platform.labels.l4')"></span>
              <span class="float-label" style="left: 34%; top: 92%; animation-delay: -8s;" x-text="$store.lang.t('platform.labels.l5')"></span>
              <span class="float-label" style="right: 1%; top: 18%; animation-delay: -4.5s;" x-text="$store.lang.t('platform.labels.l6')"></span>
              <span class="float-label" style="right: 14%; top: 40%; animation-delay: -2s;" x-text="$store.lang.t('platform.labels.l7')"></span>
              <span class="float-label" style="right: 0%; top: 62%; animation-delay: -7s;" x-text="$store.lang.t('platform.labels.l8')"></span>
              <span class="float-label" style="right: 18%; top: 82%; animation-delay: -5s;" x-text="$store.lang.t('platform.labels.l9')"></span>
              <span class="float-label" style="right: 34%; top: 94%; animation-delay: -9s;" x-text="$store.lang.t('platform.labels.l10')"></span>
            </div>
            <p class="text-[13px] text-white/60 mb-3"><span class="font-medium text-white">aynzam</span>AI Engine</p>
            <h2 class="display-md text-white max-w-[30ch]">
              <span x-text="$store.lang.t('platform.title1') + ' '"></span><br class="hidden sm:block" />
              <span x-text="$store.lang.t('platform.title2')"></span>
            </h2>
            <a href="#pillars" class="btn btn-white mt-8">
              <span x-text="$store.lang.t('platform.cta')"></span>
            </a>
          </div>

          <!-- Pillars: two cards -->
          <div id="pillars" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-[900px] mx-auto pb-24 sm:pb-32">

            <article class="pillar-card">
              <div class="pillar-art art-steel"></div>
              <div class="pillar-body">
                <h3 class="display-sm text-white">
                  <span x-text="$store.lang.t('pillars.p1.title1')"></span><br />
                  <span x-text="$store.lang.t('pillars.p1.title2')"></span>
                </h3>
                <p class="text-[13px] leading-[1.5] text-white/75 max-w-[38ch]" x-text="$store.lang.t('pillars.p1.body')"></p>
                <a href="about.html" class="btn btn-sm btn-white mt-2">
                  <span x-text="$store.lang.t('pillars.p1.cta')"></span>
                </a>
              </div>
            </article>

            <article class="pillar-card">
              <div class="pillar-art art-ember"></div>
              <div class="pillar-body">
                <h3 class="display-sm text-white">
                  <span x-text="$store.lang.t('pillars.p2.title1')"></span><br />
                  <span x-text="$store.lang.t('pillars.p2.title2')"></span>
                </h3>
                <p class="text-[13px] leading-[1.5] text-white/75 max-w-[38ch]" x-text="$store.lang.t('pillars.p2.body')"></p>
                <a href="#industries" class="btn btn-sm btn-white mt-2">
                  <span x-text="$store.lang.t('pillars.p2.cta')"></span>
                </a>
              </div>
            </article>

          </div>
        </div>
      </section>

      <!-- ===== Industries ===== -->
      <section id="industries" class="py-24 sm:py-32" x-data="{ tab: 'semi' }">
        <div class="container">
          <div class="text-center mb-8">
            <h2 class="display-lg mx-auto max-w-[22ch]">
              <span x-text="$store.lang.t('industries.title1') + ' '"></span><br class="hidden sm:block" />
              <span x-text="$store.lang.t('industries.title2')"></span>
            </h2>
          </div>

          <div class="flex justify-center mb-8">
            <div class="tabs" role="tablist">
              <template x-for="key in ['semi','battery','datacenter','pharma','automotive']" :key="key">
                <button
                  type="button"
                  role="tab"
                  class="tab"
                  :class="{ 'is-active': tab === key }"
                  :aria-selected="tab === key"
                  @click="tab = key"
                  x-text="$store.lang.t('industries.tabs.' + key)"
                ></button>
              </template>
            </div>
          </div>

          <div class="max-w-[900px] mx-auto">
            <div
              class="industry-card"
              :class="{
                'art-steel': tab === 'semi',
                'art-ember': tab === 'battery',
                'art-carbon': tab === 'datacenter',
                'art-mist': tab === 'pharma',
                'art-graphite': tab === 'automotive'
              }"
            >
              <h3 class="industry-title" x-text="$store.lang.t('industries.items.' + tab + '.title')"></h3>
              <p class="text-[13px] text-white/85 mt-12 sm:mt-20" x-text="$store.lang.t('industries.items.' + tab + '.sub')"></p>
              <div class="flex flex-wrap justify-center gap-1.5 mt-1 on-dark">
                <template x-for="chip in $store.lang.t('industries.items.' + tab + '.chips')" :key="chip">
                  <span class="chip" x-text="chip"></span>
                </template>
              </div>
              <a href="#" class="btn btn-sm btn-white mt-3" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
                <span x-text="$store.lang.t('industries.cta')"></span>
              </a>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Company ===== -->
      <section id="company" class="stage-bloom py-24 sm:py-32">
        <div class="container-narrow">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start mb-10">
            <h2 class="display-lg text-white md:col-span-7 max-w-[24ch]">
              <span x-text="$store.lang.t('company.title1')"></span>
              <span x-text="$store.lang.t('company.title2')"></span>
            </h2>
            <p class="text-[13px] leading-[1.55] text-white/85 md:col-span-5 md:pt-2" x-text="$store.lang.t('company.body')"></p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
            <a href="about.html" class="link-card link-card-light sm:col-span-3">
              <span class="link-title" x-text="$store.lang.t('company.card1')"></span>
              <span class="link-circle" aria-hidden="true">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" /></svg>
              </span>
            </a>
            <a href="#" class="link-card link-card-glass sm:col-span-2" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
              <span class="link-title" x-text="$store.lang.t('company.card2')"></span>
            </a>
          </div>
        </div>
      </section>

      <!-- ===== Final CTA ===== -->
      <section id="cta" class="stage-night py-20 sm:py-24 border-b border-white/10">
        <div class="container-narrow flex flex-col sm:flex-row sm:items-center justify-between gap-6">
          <div>
            <h2 class="display-md text-white max-w-[22ch]" x-text="$store.lang.t('finalCta.title')"></h2>
            <p class="text-[13px] text-white/60 mt-3" x-text="$store.lang.t('finalCta.note')"></p>
          </div>
          <a
            href="#"
            class="btn btn-white flex-none"
            onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;"
          >
            <span x-text="$store.lang.t('finalCta.button')"></span>
          </a>
        </div>
      </section>

    </main>

    <include src="./partials/footer.html" />
  </body>
</html>
