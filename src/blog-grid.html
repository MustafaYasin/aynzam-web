<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aynzamAI</title>
    <include src="./partials/fonts.html" />
    <include src="./partials/lang-init.html" />
  </head>

  <body x-data>
    <include src="./partials/header.html" />

    <main>
      <section class="pt-40 pb-12 sm:pt-48 sm:pb-16">
        <div class="container">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-end">
            <h1 class="display-xl lg:col-span-8 animate-fade-up delay-1" x-text="$store.lang.t('blog.title')"></h1>
            <p class="body-md max-w-[42ch] lg:col-span-4 animate-fade-up delay-2" x-text="$store.lang.t('blog.deck')"></p>
          </div>
        </div>
      </section>

      <section class="pb-24 sm:pb-32">
        <div class="container">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <template x-for="(post, i) in $store.lang.t('blog.posts')" :key="i">
              <a href="blog-single.html" class="card flex flex-col gap-5 group">
                <div class="rounded-[8px] h-[200px]" :class="['art-carbon', 'art-steel', 'art-mist'][i % 3]"></div>
                <div class="flex items-center gap-3 body-xs">
                  <span class="chip" x-text="post.tag"></span>
                  <span x-text="post.date"></span>
                </div>
                <h2 class="display-sm" x-text="post.title"></h2>
                <p class="body-sm flex-1" x-text="post.excerpt"></p>
                <span class="text-link">
                  <span x-text="$store.lang.t('blog.readMore')"></span>
                  <span class="btn-arrow" aria-hidden="true"></span>
                </span>
              </a>
            </template>
          </div>
        </div>
      </section>
    </main>

    <include src="./partials/footer.html" />
  </body>
</html>
