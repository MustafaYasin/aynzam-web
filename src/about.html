<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Über uns · aynzamAI</title>
    <meta name="description" content="aynzamAI wird von TGA- und MSR-Planern in München gebaut. Angewandte KI für Engineering-Dokumentation." />
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <include src="./partials/fonts.html" />
    <include src="./partials/lang-init.html" />
  </head>

  <body x-data>
    <include src="./partials/header.html" />

    <main>

      <!-- ===== Hero ===== -->
      <section class="pt-40 pb-16 sm:pt-48 sm:pb-24">
        <div class="container">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-end">
            <div class="lg:col-span-8">
              <p class="eyebrow mb-5 animate-fade-up delay-0" x-text="$store.lang.t('header.company')"></p>
              <h1 class="display-xl animate-fade-up delay-1">
                <span x-text="$store.lang.t('about.title1')"></span><br />
                <span x-text="$store.lang.t('about.title2')"></span>
              </h1>
            </div>
            <div class="lg:col-span-4">
              <p class="body-md max-w-[42ch] animate-fade-up delay-2" x-text="$store.lang.t('about.deck')"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Art band ===== -->
      <section class="pb-16 sm:pb-24">
        <div class="container">
          <div class="art-steel rounded-[14px] h-[280px] sm:h-[420px]"></div>
        </div>
      </section>

      <!-- ===== Values ===== -->
      <section class="pb-20 sm:pb-28">
        <div class="container">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <article class="card-tint">
              <p class="step-no mb-6">01</p>
              <h3 class="display-sm mb-3" x-text="$store.lang.t('about.v1.title')"></h3>
              <p class="body-sm" x-text="$store.lang.t('about.v1.body')"></p>
            </article>
            <article class="card-tint">
              <p class="step-no mb-6">02</p>
              <h3 class="display-sm mb-3" x-text="$store.lang.t('about.v2.title')"></h3>
              <p class="body-sm" x-text="$store.lang.t('about.v2.body')"></p>
            </article>
            <article class="card-tint">
              <p class="step-no mb-6">03</p>
              <h3 class="display-sm mb-3" x-text="$store.lang.t('about.v3.title')"></h3>
              <p class="body-sm" x-text="$store.lang.t('about.v3.body')"></p>
            </article>
          </div>
        </div>
      </section>

      <!-- ===== Stats ===== -->
      <section class="stage-dark on-dark py-24 sm:py-32">
        <div class="container-narrow">
          <p class="text-[13px] text-white/60 mb-10 text-center" x-text="$store.lang.t('about.statTitle')"></p>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
            <div class="text-center">
              <p class="display-lg text-white" x-text="$store.lang.t('about.s1.value')"></p>
              <p class="text-[13px] text-white/65 mt-2" x-text="$store.lang.t('about.s1.label')"></p>
            </div>
            <div class="text-center">
              <p class="display-lg text-white" x-text="$store.lang.t('about.s2.value')"></p>
              <p class="text-[13px] text-white/65 mt-2" x-text="$store.lang.t('about.s2.label')"></p>
            </div>
            <div class="text-center">
              <p class="display-lg text-white" x-text="$store.lang.t('about.s3.value')"></p>
              <p class="text-[13px] text-white/65 mt-2" x-text="$store.lang.t('about.s3.label')"></p>
            </div>
            <div class="text-center">
              <p class="display-lg text-white" x-text="$store.lang.t('about.s4.value')"></p>
              <p class="text-[13px] text-white/65 mt-2" x-text="$store.lang.t('about.s4.label')"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Logos ===== -->
      <section class="py-16 sm:py-20">
        <div class="container">
          <p class="text-[15px] text-center mb-8" x-text="$store.lang.t('logos.title')"></p>
          <div class="grid grid-cols-3 gap-[3px]">
            <div class="logo-cell"><img src="./images/logos/powerco.png" :alt="$store.lang.t('logos.c1')" loading="lazy" /></div>
            <div class="logo-cell"><img src="./images/logos/vw.png" :alt="$store.lang.t('logos.c2')" loading="lazy" style="max-height: 44px;" /></div>
            <div class="logo-cell"><img src="./images/logos/exyte.png" :alt="$store.lang.t('logos.c3')" loading="lazy" /></div>
          </div>
        </div>
      </section>

      <!-- ===== Final CTA ===== -->
      <section class="stage-night py-20 sm:py-24 border-b border-white/10">
        <div class="container-narrow flex flex-col sm:flex-row sm:items-center justify-between gap-6">
          <h2 class="display-md text-white max-w-[22ch]" x-text="$store.lang.t('about.ctaTitle')"></h2>
          <a href="#" class="btn btn-white flex-none" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
            <span x-text="$store.lang.t('about.ctaButton')"></span>
          </a>
        </div>
      </section>

    </main>

    <include src="./partials/footer.html" />
  </body>
</html>
