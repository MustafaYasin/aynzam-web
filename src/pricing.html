<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preise · AynzamAI</title>
    <meta name="description" content="Pläne für Solo-Planer, Planungsbüros und Engineering-Konzerne. Pilot mit 10 gratis Outputs, keine Kreditkarte." />
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <include src="./partials/fonts.html" />
    <include src="./partials/lang-init.html" />
  </head>

  <body x-data="{ loaded: true, annual: false }" x-init="loaded = true">
    <include src="./partials/header.html" />

    <main>

      <!-- ===== Hero ===== -->
      <section class="stage relative pt-36 pb-16 sm:pt-44 sm:pb-20">
        <span class="stage-glow" style="top: 20%; left: -10%;" aria-hidden="true"></span>

        <div class="container relative">
          <div class="max-w-3xl">
            <p class="eyebrow mb-5" x-text="$store.lang.t('pricingPage.eyebrow')"></p>
            <h1 class="headline-xl mb-6">
              <span x-text="$store.lang.t('pricingPage.titleA')"></span>
              <em x-text="$store.lang.t('pricingPage.titleEm')"></em><span x-text="$store.lang.t('pricingPage.titleB')"></span>
            </h1>
            <p class="deck max-w-[60ch] mb-8" x-text="$store.lang.t('pricingPage.deck')"></p>

            <!-- Pilot row -->
            <div class="card flex flex-col sm:flex-row sm:items-center gap-4 max-w-2xl">
              <div class="flex-1">
                <p class="eyebrow mb-2" x-text="$store.lang.t('pricingPage.pilot.tag')"></p>
                <p class="headline-sm mb-1" x-text="$store.lang.t('pricingPage.pilot.title')"></p>
                <p class="body-sm" x-text="$store.lang.t('pricingPage.pilot.body')"></p>
              </div>
              <a href="#" class="btn-primary flex-shrink-0" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
                <span x-text="$store.lang.t('pricingPage.pilot.button')"></span>
                <span class="btn-arrow" aria-hidden="true"></span>
              </a>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Billing Toggle ===== -->
      <section class="pb-10">
        <div class="container">
          <div class="flex items-center justify-center gap-4">
            <span class="mono-sm" :style="!annual ? 'color: var(--fg);' : ''" x-text="$store.lang.t('pricingPage.toggle.monthly')"></span>
            <button
              type="button"
              role="switch"
              :aria-checked="annual"
              @click="annual = !annual"
              class="relative w-12 h-7 rounded-full transition-colors"
              :style="annual ? 'background: var(--clay);' : 'background: var(--border);'"
              aria-label="Toggle annual billing"
            >
              <span class="absolute top-0.5 w-6 h-6 rounded-full bg-white shadow transition-transform"
                    :style="annual ? 'transform: translateX(22px);' : 'transform: translateX(2px);'"></span>
            </button>
            <span class="mono-sm flex items-center gap-2" :style="annual ? 'color: var(--fg);' : ''">
              <span x-text="$store.lang.t('pricingPage.toggle.yearly')"></span>
              <span class="mark-clay" x-text="$store.lang.t('pricingPage.toggle.discount')"></span>
            </span>
          </div>
        </div>
      </section>

      <!-- ===== 3 Tier Cards ===== -->
      <section class="pb-20 sm:pb-24">
        <div class="container">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-6xl mx-auto">

            <!-- Starter -->
            <article id="tier-starter" class="card flex flex-col">
              <p class="eyebrow mb-3" x-text="$store.lang.t('pricingPage.tiers.starter.tag')"></p>
              <h3 class="headline-md mb-2" x-text="$store.lang.t('pricingPage.tiers.starter.name')"></h3>
              <p class="body-sm mb-6" x-text="$store.lang.t('pricingPage.tiers.starter.tagline')"></p>

              <div class="flex items-baseline gap-1 mb-1">
                <span class="headline-lg" x-text="annual ? $store.lang.t('pricingPage.tiers.starter.priceYearly') : $store.lang.t('pricingPage.tiers.starter.price')"></span>
                <span class="mono-sm" x-text="$store.lang.t('pricingPage.tiers.starter.unit')"></span>
              </div>
              <p class="mono-sm mb-7" x-show="annual" x-text="$store.lang.t('pricingPage.tiers.starter.priceNote')"></p>
              <p class="mono-sm mb-7" x-show="!annual">&nbsp;</p>

              <ul class="flex flex-col gap-2.5 body-sm mb-8 flex-1">
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.starter.f1')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.starter.f2')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.starter.f3')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.starter.f4')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.starter.f5')"></span></li>
              </ul>

              <a href="#" class="btn-outline w-full" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
                <span x-text="$store.lang.t('pricingPage.tiers.starter.cta')"></span>
                <span class="btn-arrow" aria-hidden="true"></span>
              </a>
            </article>

            <!-- Studio (featured) -->
            <article id="tier-studio" class="card-clay flex flex-col">
              <div class="flex items-center justify-between mb-3">
                <p class="eyebrow" x-text="$store.lang.t('pricingPage.tiers.studio.tag')"></p>
                <span class="mark-clay" x-text="$store.lang.t('pricingPage.tiers.studio.badge')"></span>
              </div>
              <h3 class="headline-md mb-2" x-text="$store.lang.t('pricingPage.tiers.studio.name')"></h3>
              <p class="body-sm mb-6" x-text="$store.lang.t('pricingPage.tiers.studio.tagline')"></p>

              <div class="flex items-baseline gap-1 mb-1">
                <span class="headline-lg" x-text="annual ? $store.lang.t('pricingPage.tiers.studio.priceYearly') : $store.lang.t('pricingPage.tiers.studio.price')"></span>
                <span class="mono-sm" x-text="$store.lang.t('pricingPage.tiers.studio.unit')"></span>
              </div>
              <p class="mono-sm mb-7" x-show="annual" x-text="$store.lang.t('pricingPage.tiers.studio.priceNote')"></p>
              <p class="mono-sm mb-7" x-show="!annual">&nbsp;</p>

              <ul class="flex flex-col gap-2.5 body-sm mb-8 flex-1">
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.studio.f1')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.studio.f2')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.studio.f3')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.studio.f4')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.studio.f5')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.studio.f6')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.studio.f7')"></span></li>
              </ul>

              <a href="#" class="btn-primary w-full" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
                <span x-text="$store.lang.t('pricingPage.tiers.studio.cta')"></span>
                <span class="btn-arrow" aria-hidden="true"></span>
              </a>
            </article>

            <!-- Engineering -->
            <article id="tier-engineering" class="card flex flex-col">
              <p class="eyebrow mb-3" x-text="$store.lang.t('pricingPage.tiers.engineering.tag')"></p>
              <h3 class="headline-md mb-2" x-text="$store.lang.t('pricingPage.tiers.engineering.name')"></h3>
              <p class="body-sm mb-6" x-text="$store.lang.t('pricingPage.tiers.engineering.tagline')"></p>

              <div class="flex items-baseline gap-1 mb-1">
                <span class="headline-lg" x-text="annual ? $store.lang.t('pricingPage.tiers.engineering.priceYearly') : $store.lang.t('pricingPage.tiers.engineering.price')"></span>
                <span class="mono-sm" x-text="$store.lang.t('pricingPage.tiers.engineering.unit')"></span>
              </div>
              <p class="mono-sm mb-7" x-show="annual" x-text="$store.lang.t('pricingPage.tiers.engineering.priceNote')"></p>
              <p class="mono-sm mb-7" x-show="!annual">&nbsp;</p>

              <ul class="flex flex-col gap-2.5 body-sm mb-8 flex-1">
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.engineering.f1')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.engineering.f2')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.engineering.f3')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.engineering.f4')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.engineering.f5')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.engineering.f6')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.engineering.f7')"></span></li>
                <li class="flex gap-2.5"><span class="mono-sm" style="color: var(--clay);" aria-hidden="true">+</span><span x-text="$store.lang.t('pricingPage.tiers.engineering.f8')"></span></li>
              </ul>

              <a href="#" class="btn-outline w-full" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
                <span x-text="$store.lang.t('pricingPage.tiers.engineering.cta')"></span>
                <span class="btn-arrow" aria-hidden="true"></span>
              </a>
            </article>
          </div>

          <!-- Overage note -->
          <p class="mono-sm text-center mt-10" x-text="$store.lang.t('pricingPage.overageNote')"></p>
        </div>
      </section>

      <!-- ===== Enterprise row ===== -->
      <section class="stage py-20 sm:py-24 border-y border-[var(--border-soft)]">
        <span class="stage-glow" style="top: -10%; right: -10%;" aria-hidden="true"></span>
        <div class="container relative">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center max-w-6xl mx-auto">
            <div class="lg:col-span-7">
              <p class="eyebrow mb-5" x-text="$store.lang.t('pricingPage.enterprise.eyebrow')"></p>
              <h2 class="headline-lg mb-5">
                <span x-text="$store.lang.t('pricingPage.enterprise.titleA')"></span>
                <em x-text="$store.lang.t('pricingPage.enterprise.titleEm')"></em><span x-text="$store.lang.t('pricingPage.enterprise.titleB')"></span>
              </h2>
              <p class="deck max-w-[58ch] mb-6" x-text="$store.lang.t('pricingPage.enterprise.body')"></p>
              <ul class="flex flex-wrap gap-2 mb-8">
                <li class="norm-chip" x-text="$store.lang.t('pricingPage.enterprise.b1')"></li>
                <li class="norm-chip" x-text="$store.lang.t('pricingPage.enterprise.b2')"></li>
                <li class="norm-chip" x-text="$store.lang.t('pricingPage.enterprise.b3')"></li>
                <li class="norm-chip" x-text="$store.lang.t('pricingPage.enterprise.b4')"></li>
                <li class="norm-chip" x-text="$store.lang.t('pricingPage.enterprise.b5')"></li>
                <li class="norm-chip" x-text="$store.lang.t('pricingPage.enterprise.b6')"></li>
              </ul>
              <a href="#" class="btn-primary" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
                <span x-text="$store.lang.t('pricingPage.enterprise.cta')"></span>
                <span class="btn-arrow" aria-hidden="true"></span>
              </a>
            </div>
            <div class="lg:col-span-5">
              <div class="card">
                <p class="eyebrow mb-3" x-text="$store.lang.t('pricingPage.enterprise.priceLabel')"></p>
                <p class="headline-md mb-2" x-text="$store.lang.t('pricingPage.enterprise.priceTitle')"></p>
                <p class="body-md mb-5" x-text="$store.lang.t('pricingPage.enterprise.priceBody')"></p>
                <hr class="hr-tick mb-5" />
                <p class="mono-sm" x-text="$store.lang.t('pricingPage.enterprise.priceNote')"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Compare table ===== -->
      <section class="py-20 sm:py-24">
        <div class="container">
          <div class="max-w-3xl mb-12">
            <p class="eyebrow mb-5" x-text="$store.lang.t('pricingPage.compare.eyebrow')"></p>
            <h2 class="headline-lg" x-text="$store.lang.t('pricingPage.compare.title')"></h2>
          </div>

          <div class="overflow-x-auto -mx-6 sm:mx-0">
            <table class="w-full min-w-[640px] text-left">
              <thead>
                <tr class="border-b" style="border-color: var(--border-strong);">
                  <th class="py-4 pr-4 body-sm font-medium text-[var(--fg-muted)]"></th>
                  <th class="py-4 px-4 mono-sm text-[var(--fg)] text-center" x-text="$store.lang.t('pricingPage.tiers.starter.name')"></th>
                  <th class="py-4 px-4 mono-sm text-center" style="color: var(--clay);" x-text="$store.lang.t('pricingPage.tiers.studio.name')"></th>
                  <th class="py-4 px-4 mono-sm text-[var(--fg)] text-center" x-text="$store.lang.t('pricingPage.tiers.engineering.name')"></th>
                  <th class="py-4 px-4 mono-sm text-[var(--fg)] text-center" x-text="$store.lang.t('pricingPage.enterprise.name')"></th>
                </tr>
              </thead>
              <tbody class="text-[var(--fg-soft)] text-sm">
                <template x-for="row in $store.lang.t('pricingPage.compare.rows')" :key="row.label">
                  <tr class="border-b" style="border-color: var(--border-soft);">
                    <td class="py-3 pr-4 font-medium text-[var(--fg)]" x-text="row.label"></td>
                    <td class="py-3 px-4 text-center font-mono text-xs" x-text="row.s"></td>
                    <td class="py-3 px-4 text-center font-mono text-xs" style="color: var(--clay);" x-text="row.t"></td>
                    <td class="py-3 px-4 text-center font-mono text-xs" x-text="row.e"></td>
                    <td class="py-3 px-4 text-center font-mono text-xs" x-text="row.x"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ===== FAQ ===== -->
      <section class="stage py-20 sm:py-24 border-y border-[var(--border-soft)]">
        <div class="container relative">
          <div class="max-w-3xl mb-12">
            <p class="eyebrow mb-5" x-text="$store.lang.t('pricingPage.faq.eyebrow')"></p>
            <h2 class="headline-lg" x-text="$store.lang.t('pricingPage.faq.title')"></h2>
          </div>

          <div class="max-w-3xl flex flex-col gap-3" x-data="{ open: null }">
            <template x-for="(item, idx) in $store.lang.t('pricingPage.faq.items')" :key="idx">
              <article class="card !p-0 overflow-hidden">
                <button
                  type="button"
                  class="w-full flex items-center justify-between gap-4 p-5 text-left transition-colors hover:bg-[var(--bg-elev-strong)]"
                  @click="open = (open === idx) ? null : idx"
                  :aria-expanded="open === idx"
                >
                  <span class="font-medium text-[var(--fg)]" x-text="item.q"></span>
                  <svg class="w-5 h-5 flex-shrink-0 transition-transform duration-200 text-[var(--fg-muted)]"
                       :class="{ 'rotate-45': open === idx }"
                       fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                  </svg>
                </button>
                <div
                  x-show="open === idx"
                  x-transition:enter="transition ease-out duration-200"
                  x-transition:enter-start="opacity-0 -translate-y-1"
                  x-transition:enter-end="opacity-100 translate-y-0"
                  x-transition:leave="transition ease-in duration-150"
                  x-transition:leave-start="opacity-100 translate-y-0"
                  x-transition:leave-end="opacity-0 -translate-y-1"
                  class="px-5 pb-5"
                >
                  <p class="body-md" x-text="item.a"></p>
                </div>
              </article>
            </template>
          </div>
        </div>
      </section>

      <!-- ===== Final CTA ===== -->
      <section class="py-24 sm:py-32">
        <div class="container">
          <div class="max-w-2xl mx-auto text-center">
            <p class="eyebrow mb-6 inline-block" x-text="$store.lang.t('pricingPage.finalCta.eyebrow')"></p>
            <h2 class="headline-lg mb-5">
              <span x-text="$store.lang.t('pricingPage.finalCta.titleA')"></span>
              <em x-text="$store.lang.t('pricingPage.finalCta.titleEm')"></em><span x-text="$store.lang.t('pricingPage.finalCta.titleB')"></span>
            </h2>
            <p class="deck mb-10" x-text="$store.lang.t('pricingPage.finalCta.deck')"></p>
            <a href="#" class="btn-primary" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
              <span x-text="$store.lang.t('pricingPage.finalCta.button')"></span>
              <span class="btn-arrow" aria-hidden="true"></span>
            </a>
          </div>
        </div>
      </section>

    </main>

    <include src="./partials/footer.html" />
  </body>
</html>
