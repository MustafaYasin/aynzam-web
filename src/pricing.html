<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preise · aynzamAI</title>
    <meta name="description" content="Pläne für Solo-Planer, Planungsbüros und Engineering-Konzerne. Pilot mit 10 gratis Outputs, keine Kreditkarte." />
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <include src="./partials/fonts.html" />
    <include src="./partials/lang-init.html" />
  </head>

  <body x-data="{ annual: false }">
    <include src="./partials/header.html" />

    <main>

      <!-- ===== Hero ===== -->
      <section class="pt-40 pb-14 sm:pt-48 sm:pb-16">
        <div class="container">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-end">
            <div class="lg:col-span-8">
              <p class="eyebrow mb-5 animate-fade-up delay-0" x-text="$store.lang.t('pricingPage.eyebrow')"></p>
              <h1 class="display-xl animate-fade-up delay-1">
                <span x-text="$store.lang.t('pricingPage.title1')"></span><br />
                <span x-text="$store.lang.t('pricingPage.title2')"></span>
              </h1>
            </div>
            <div class="lg:col-span-4">
              <p class="body-md max-w-[40ch] animate-fade-up delay-2" x-text="$store.lang.t('pricingPage.deck')"></p>
            </div>
          </div>

          <!-- Pilot row -->
          <div class="card-tint flex flex-col sm:flex-row sm:items-center gap-5 mt-12">
            <div class="flex-1">
              <p class="eyebrow mb-2" x-text="$store.lang.t('pricingPage.pilot.tag')"></p>
              <p class="display-sm mb-1" x-text="$store.lang.t('pricingPage.pilot.title')"></p>
              <p class="body-sm" x-text="$store.lang.t('pricingPage.pilot.body')"></p>
            </div>
            <a href="#" class="btn btn-primary flex-none" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
              <span x-text="$store.lang.t('pricingPage.pilot.button')"></span>
            </a>
          </div>
        </div>
      </section>

      <!-- ===== Billing toggle ===== -->
      <section class="pb-8">
        <div class="container flex justify-center">
          <div class="tabs" role="tablist">
            <button type="button" class="tab" :class="{ 'is-active': !annual }" @click="annual = false" x-text="$store.lang.t('pricingPage.toggle.monthly')"></button>
            <button type="button" class="tab" :class="{ 'is-active': annual }" @click="annual = true">
              <span x-text="$store.lang.t('pricingPage.toggle.yearly')"></span>
              <span class="ml-2 text-[11px]" style="color: var(--accent);" x-text="$store.lang.t('pricingPage.toggle.discount')"></span>
            </button>
          </div>
        </div>
      </section>

      <!-- ===== Tier cards ===== -->
      <section class="pb-20 sm:pb-24">
        <div class="container">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">

            <!-- Starter -->
            <article class="card flex flex-col">
              <h3 class="display-sm mb-1" x-text="$store.lang.t('pricingPage.tiers.starter.name')"></h3>
              <p class="body-sm mb-8" x-text="$store.lang.t('pricingPage.tiers.starter.tagline')"></p>
              <div class="flex items-baseline gap-2 mb-1">
                <span class="display-lg" x-text="annual ? $store.lang.t('pricingPage.tiers.starter.priceYearly') : $store.lang.t('pricingPage.tiers.starter.price')"></span>
                <span class="body-sm" x-text="$store.lang.t('pricingPage.tiers.starter.unit')"></span>
              </div>
              <p class="body-xs mb-8 min-h-[18px]" x-text="annual ? $store.lang.t('pricingPage.tiers.starter.priceNote') : ''"></p>
              <hr class="hr mb-6" />
              <ul class="flex flex-col gap-2.5 body-sm mb-8 flex-1">
                <li x-text="$store.lang.t('pricingPage.tiers.starter.f1')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.starter.f2')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.starter.f3')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.starter.f4')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.starter.f5')"></li>
              </ul>
              <a href="#" class="btn btn-outline w-full" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
                <span x-text="$store.lang.t('pricingPage.tiers.starter.cta')"></span>
              </a>
            </article>

            <!-- Studio -->
            <article class="card flex flex-col" style="background: var(--ink); color: var(--paper); border-color: var(--ink);">
              <div class="flex items-center justify-between mb-1">
                <h3 class="display-sm text-white" x-text="$store.lang.t('pricingPage.tiers.studio.name')"></h3>
                <span class="chip" style="background: var(--paper); color: var(--ink); border-color: var(--paper);" x-text="$store.lang.t('pricingPage.tiers.studio.badge')"></span>
              </div>
              <p class="text-[14px] text-white/60 mb-8" x-text="$store.lang.t('pricingPage.tiers.studio.tagline')"></p>
              <div class="flex items-baseline gap-2 mb-1">
                <span class="display-lg text-white" x-text="annual ? $store.lang.t('pricingPage.tiers.studio.priceYearly') : $store.lang.t('pricingPage.tiers.studio.price')"></span>
                <span class="text-[14px] text-white/60" x-text="$store.lang.t('pricingPage.tiers.studio.unit')"></span>
              </div>
              <p class="text-[12px] text-white/50 mb-8 min-h-[18px]" x-text="annual ? $store.lang.t('pricingPage.tiers.studio.priceNote') : ''"></p>
              <hr class="hr mb-6" style="border-color: rgba(255,255,255,0.14);" />
              <ul class="flex flex-col gap-2.5 text-[14px] text-white/80 mb-8 flex-1">
                <li x-text="$store.lang.t('pricingPage.tiers.studio.f1')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.studio.f2')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.studio.f3')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.studio.f4')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.studio.f5')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.studio.f6')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.studio.f7')"></li>
              </ul>
              <a href="#" class="btn btn-white w-full" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
                <span x-text="$store.lang.t('pricingPage.tiers.studio.cta')"></span>
              </a>
            </article>

            <!-- Engineering -->
            <article class="card flex flex-col">
              <h3 class="display-sm mb-1" x-text="$store.lang.t('pricingPage.tiers.engineering.name')"></h3>
              <p class="body-sm mb-8" x-text="$store.lang.t('pricingPage.tiers.engineering.tagline')"></p>
              <div class="flex items-baseline gap-2 mb-1">
                <span class="display-lg" x-text="annual ? $store.lang.t('pricingPage.tiers.engineering.priceYearly') : $store.lang.t('pricingPage.tiers.engineering.price')"></span>
                <span class="body-sm" x-text="$store.lang.t('pricingPage.tiers.engineering.unit')"></span>
              </div>
              <p class="body-xs mb-8 min-h-[18px]" x-text="annual ? $store.lang.t('pricingPage.tiers.engineering.priceNote') : ''"></p>
              <hr class="hr mb-6" />
              <ul class="flex flex-col gap-2.5 body-sm mb-8 flex-1">
                <li x-text="$store.lang.t('pricingPage.tiers.engineering.f1')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.engineering.f2')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.engineering.f3')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.engineering.f4')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.engineering.f5')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.engineering.f6')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.engineering.f7')"></li>
                <li x-text="$store.lang.t('pricingPage.tiers.engineering.f8')"></li>
              </ul>
              <a href="#" class="btn btn-outline w-full" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
                <span x-text="$store.lang.t('pricingPage.tiers.engineering.cta')"></span>
              </a>
            </article>
          </div>

          <p class="body-xs text-center mt-8" x-text="$store.lang.t('pricingPage.overageNote')"></p>
        </div>
      </section>

      <!-- ===== Enterprise ===== -->
      <section class="stage-dark on-dark py-24 sm:py-32">
        <div class="container-narrow">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
            <div class="lg:col-span-7">
              <p class="text-[13px] text-white/60 mb-3" x-text="$store.lang.t('pricingPage.enterprise.eyebrow')"></p>
              <h2 class="display-md text-white mb-5 max-w-[24ch]">
                <span x-text="$store.lang.t('pricingPage.enterprise.title1')"></span>
                <span x-text="$store.lang.t('pricingPage.enterprise.title2')"></span>
              </h2>
              <p class="text-[15px] leading-[1.55] text-white/80 max-w-[52ch] mb-6" x-text="$store.lang.t('pricingPage.enterprise.body')"></p>
              <ul class="flex flex-wrap gap-1.5 mb-8">
                <li class="chip" x-text="$store.lang.t('pricingPage.enterprise.b1')"></li>
                <li class="chip" x-text="$store.lang.t('pricingPage.enterprise.b2')"></li>
                <li class="chip" x-text="$store.lang.t('pricingPage.enterprise.b3')"></li>
                <li class="chip" x-text="$store.lang.t('pricingPage.enterprise.b4')"></li>
                <li class="chip" x-text="$store.lang.t('pricingPage.enterprise.b5')"></li>
                <li class="chip" x-text="$store.lang.t('pricingPage.enterprise.b6')"></li>
              </ul>
              <a href="#" class="btn btn-white" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
                <span x-text="$store.lang.t('pricingPage.enterprise.cta')"></span>
              </a>
            </div>
            <div class="lg:col-span-5">
              <div class="link-card-glass rounded-[10px] p-7">
                <p class="text-[12px] text-white/60 mb-2" x-text="$store.lang.t('pricingPage.enterprise.priceLabel')"></p>
                <p class="display-sm text-white mb-3" x-text="$store.lang.t('pricingPage.enterprise.priceTitle')"></p>
                <p class="text-[14px] leading-[1.55] text-white/80 mb-5" x-text="$store.lang.t('pricingPage.enterprise.priceBody')"></p>
                <hr class="hr mb-5" style="border-color: rgba(255,255,255,0.14);" />
                <p class="text-[12px] text-white/60" x-text="$store.lang.t('pricingPage.enterprise.priceNote')"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Compare table ===== -->
      <section class="py-20 sm:py-24">
        <div class="container">
          <div class="mb-10">
            <p class="eyebrow mb-4" x-text="$store.lang.t('pricingPage.compare.eyebrow')"></p>
            <h2 class="display-md" x-text="$store.lang.t('pricingPage.compare.title')"></h2>
          </div>

          <div class="overflow-x-auto -mx-5 px-5 sm:mx-0 sm:px-0">
            <table class="w-full min-w-[640px] text-left">
              <thead>
                <tr class="border-b" style="border-color: var(--line-strong);">
                  <th class="py-4 pr-4"></th>
                  <th class="py-4 px-4 text-[13px] font-medium text-center" x-text="$store.lang.t('pricingPage.tiers.starter.name')"></th>
                  <th class="py-4 px-4 text-[13px] font-medium text-center" x-text="$store.lang.t('pricingPage.tiers.studio.name')"></th>
                  <th class="py-4 px-4 text-[13px] font-medium text-center" x-text="$store.lang.t('pricingPage.tiers.engineering.name')"></th>
                  <th class="py-4 px-4 text-[13px] font-medium text-center" x-text="$store.lang.t('pricingPage.enterprise.name')"></th>
                </tr>
              </thead>
              <tbody class="text-[14px]">
                <template x-for="row in $store.lang.t('pricingPage.compare.rows')" :key="row.label">
                  <tr class="border-b" style="border-color: var(--line);">
                    <td class="py-3 pr-4 text-[var(--ink)]" x-text="row.label"></td>
                    <td class="py-3 px-4 text-center text-[var(--ink-3)]" x-text="row.s"></td>
                    <td class="py-3 px-4 text-center text-[var(--ink)]" x-text="row.t"></td>
                    <td class="py-3 px-4 text-center text-[var(--ink-3)]" x-text="row.e"></td>
                    <td class="py-3 px-4 text-center text-[var(--ink-3)]" x-text="row.x"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ===== FAQ ===== -->
      <section class="py-20 sm:py-24 bg-[var(--paper-2)] border-y border-[var(--line)]">
        <div class="container">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <div class="lg:col-span-4">
              <p class="eyebrow mb-4" x-text="$store.lang.t('pricingPage.faq.eyebrow')"></p>
              <h2 class="display-md" x-text="$store.lang.t('pricingPage.faq.title')"></h2>
            </div>
            <div class="lg:col-span-8" x-data="{ open: 0 }">
              <template x-for="(item, idx) in $store.lang.t('pricingPage.faq.items')" :key="idx">
                <div class="border-b" style="border-color: var(--line);">
                  <button
                    type="button"
                    class="w-full flex items-center justify-between gap-6 py-5 text-left"
                    @click="open = (open === idx) ? null : idx"
                    :aria-expanded="open === idx"
                  >
                    <span class="text-[16px] font-medium tracking-[-0.01em]" x-text="item.q"></span>
                    <svg class="w-4 h-4 flex-none transition-transform duration-200 text-[var(--ink-3)]" :class="{ 'rotate-45': open === idx }" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.6" aria-hidden="true">
                      <path stroke-linecap="round" d="M12 5v14M5 12h14" />
                    </svg>
                  </button>
                  <div x-show="open === idx" x-transition.opacity.duration.200ms class="pb-6">
                    <p class="body-md max-w-[62ch]" x-text="item.a"></p>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Final CTA ===== -->
      <section class="stage-night py-20 sm:py-24 border-b border-white/10">
        <div class="container-narrow flex flex-col sm:flex-row sm:items-center justify-between gap-6">
          <h2 class="display-md text-white max-w-[24ch]" x-text="$store.lang.t('pricingPage.finalCta.title')"></h2>
          <a href="#" class="btn btn-white flex-none" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/mustafayasin'});return false;">
            <span x-text="$store.lang.t('pricingPage.finalCta.button')"></span>
          </a>
        </div>
      </section>

    </main>

    <include src="./partials/footer.html" />
  </body>
</html>
